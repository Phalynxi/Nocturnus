# A name resolved as ~/.config/yazi/flavors/<name>.yazi/; a path is silently
# ignored. theme_manager.py writes the flavour and its preview tmTheme on every
# palette push. The terminal is always dark, so both variants use it.
[flavor]
dark = "nocturnus"
light = "nocturnus"
