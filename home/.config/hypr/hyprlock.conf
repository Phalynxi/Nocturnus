# mybar lockscreen: blurred screenshot + clock + album art + now playing.
# Lock with Super+L (or launcher power menu). Art synced by `lockart` daemon.

general {
    grace = 3
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

background {
    monitor =
    path = /home/octal/.cache/mybar/lock-bg.jpg
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
    contrast = 1.0
}

# now playing (wallpaper video filtered out by locktrack)
label {
    monitor =
    text = cmd[update:2000] /home/octal/.local/bin/locktrack
    color = rgba(255, 217, 217, 0.85)
    font_size = 14
    font_family = JetBrains Mono
    position = 0, 300
    halign = center
    valign = center
}

# big clock
label {
    monitor =
    text = $TIME
    color = rgb(e6e6e6)
    font_size = 96
    font_family = JetBrains Mono
    position = 0, 45
    halign = center
    valign = center
}

# date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %b %d"
    color = rgba(230, 230, 230, 0.75)
    font_size = 18
    font_family = JetBrains Mono
    position = 0, -30
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 44
    position = 0, -290
    halign = center
    valign = center
    dots_size = 0.25
    dots_spacing = 0.3
    fade_on_empty = false
    rounding = 14
    outline_thickness = 2
    inner_color = rgba(17, 17, 27, 0.55)
    outer_color = rgb(e6e6e6)
    check_color = rgb(120, 220, 160)
    fail_color = rgb(255, 110, 110)
    font_color = rgb(230, 230, 230)
    font_family = JetBrains Mono
    placeholder_text = password
    hide_input = false
}
